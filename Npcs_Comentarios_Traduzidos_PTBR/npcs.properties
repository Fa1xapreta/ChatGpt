#=============================================================
# Inteligência artificial (IA)
#=============================================================

# Se True, os guardas atacarão monstros agressivos assim que os avistarem.
# Padrão: False.
GuardAttackAggroMob = False

# Distância máxima que os monstros podem percorrer aleatoriamente a partir do ponto de nascimento.
MaxDriftRange = 140

# Distância máxima que os chefes épicos podem percorrer aleatoriamente a partir do ponto de nascimento.
MaxDriftRangeEpic = 600

# Intervalo, em milissegundos, para atualizar completamente a lista de objetos conhecidos (knownlist).
# Nas atualizações baseadas em movimento, esse intervalo é usado para as atualizações intermediárias.
# ATENÇÃO: use um intervalo entre 300 e 2000. Valores muito baixos podem sobrecarregar a CPU; valores muito altos podem prejudicar a atualização das listas.
# Padrão: 1250
KnownListUpdateInterval = 1250

# Tempos mínimo e máximo, em segundos, de espera entre as animações dos NPCs.
# Mantenha MinNPCAnimation menor ou igual a MaxNPCAnimation.
MinNPCAnimation = 20
MaxNPCAnimation = 40
MinMonsterAnimation = 10
MaxMonsterAnimation = 40

# Opções das regiões do mundo: elas podem ser ativadas e desativadas automaticamente. Isso também afeta o carregamento
# e o processamento das tarefas de IA e, futuramente, da geodata dentro de cada região.
# Uma região é ativada imediatamente quando recebe um jogador; depois, são ativadas
# as oito regiões vizinhas após o tempo especificado, em segundos.
# A região e suas vizinhas são desativadas após o tempo especificado,
# em segundos, sem jogadores presentes nela ou em qualquer uma das regiões vizinhas.
# A opção GridsAlwaysOn ignora esse funcionamento e mantém todas as regiões sempre ativas.
GridsAlwaysOn = False
GridNeighborTurnOnTime = 1
GridNeighborTurnOffTime = 90

