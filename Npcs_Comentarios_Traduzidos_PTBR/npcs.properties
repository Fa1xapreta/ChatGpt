#=============================================================
# Recursos de PvP e itens na interface
#=============================================================
# --- Badge de posicao no Top PvP sobre a cabeca (CustomEvent 88554) ---
# Quem esta no top N do ranking global de PvP (characters.pvpkills) ganha a textura
# L2UI_CH3.HeaderRanking.head_rank_<N> na cabeca, visivel pra quem estiver por perto.
# Precisa das texturas head_rank_1..N no L2UI_CH3.utx do client, senao o badge fica
# invisivel (a textura nao existe, o client so nao desenha nada).
# Padrão: False
ShowPvpRankHud = True
# Intervalo do poll que difunde mudanca de posicao (ms). Nao consulta o banco.
ShowPvpRankHudInterval = 2000
# Raio em que o badge de um jogador e enviado aos outros.
ShowPvpRankHudRadius = 2000
# Quantas posicoes ganham badge (1..10) - limitado pelas texturas que existem.
ShowPvpRankHudTop = 10
# De quanto em quanto tempo o top e RELIDO do banco (ms). Essa e a consulta cara;
# nao vale a pena baixar muito, o ranking global muda devagar. Minimo 30000.
ShowPvpRankHudRefresh = 300000

# --- Kill feed PvP: aviso de quem matou quem (CustomEvent 88546) ---
# Padrão: True
ShowKillFeed = True
# Raio em que o feed e enviado a terceiros (guarda ativa, ver README sobre isso).
ShowKillFeedRadius = 2000
# Se True, manda o CustomEvent 88546 pro servidor INTEIRO (nao so pra quem esta perto).
ShowKillFeedGlobal = False
# Se True, mostra tambem morte de fake player (bot) contra fake player.
ShowKillFeedBots = True

# --- Badge de raridade (Tier) no tooltip de item (CustomEvent 88558) ---
# Item com <set name="tier" val="N" /> no XML ganha fundo especial no tooltip.
# Tabela mandada 1x no login (tier e do template do item, nunca muda em runtime).
# Padrão: True
ShowItemTier = True
