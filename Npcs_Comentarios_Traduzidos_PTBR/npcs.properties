#=============================================================
# Configurações diversas
#=============================================================

# Permitir o uso dos Class Masters para realizar transferências de classe.
# Padrão = False
AllowClassMasters = True

# ConfigClassMaster=1;[57(100000)];[];2;[57(1000000)];[];3;[57(10000000)],[5575(1000000)];[6622(1)] 
# Primeira transferência de classe por 100.000 Adena (ID do item: 57).
# Segunda transferência de classe por 1.000.000 Adena (ID do item: 57).
# Terceira transferência de classe por 10.000.000 Adena (ID: 57) e 1.000.000 Ancient Adena (ID: 5575).
# Na terceira transferência, o jogador receberá 1 Book of Giants (ID do item: 6622).
# ConfigClassMaster=1;[];[];2;[];[];3;[];[] 
# Primeira, segunda e terceira transferências de classe gratuitas, sem recompensas.
# ConfigClassMaster=1;[];[];2;[];[]
# Permitir somente a primeira e a segunda transferências de classe.
ConfigClassMaster = 1;[];[];2;[];[];3;[];[]

# Os Class Masters permitirão escolher qualquer classe, de qualquer etapa da árvore de classes.
# Por exemplo, um Dwarven Fighter poderá avançar para:
# Artisan, Scavenger, Warsmith, Bounty Hunter, Maestro, Fortune Seeker.
# Porém, um Warsmith poderá avançar somente para Maestro.
# Padrão = False
AllowEntireTree = False

# Ao atingir os níveis 20, 40 e 76, o personagem receberá uma página de tutorial
# com todas as opções disponíveis, podendo selecionar e realizar imediatamente
# a transferência de classe ou deixar a escolha para depois (no próximo login).
# Pode ser usado com ou sem os Class Masters tradicionais.
# Padrão = False
AlternateClassMaster = True

# Permitir teletransporte gratuito pelo mundo.
# Padrão: False.
AltFreeTeleporting = True

# Anunciar aos jogadores a localização dos NPCs Mammon durante o período de validação dos selos.
# Padrão: False.
AnnounceMammonSpawn = False

# Comportamento alternativo dos monstros em zonas de paz.
# Padrão = True. Use False para impedir que monstros ataquem automaticamente jogadores em zonas de paz.
AltMobAgroInPeaceZone = True

# Exibir o nível e a agressividade dos monstros.
ShowNpcLevel = False

# Exibir os emblemas de clã e aliança nos NPCs. Padrão: False.
ShowNpcCrest = False

# Exibir emblema e título do clã atacante nos Raid Bosses e chefes épicos. Padrão: False.
ShowBoss_Title_Crest = False

# Exibir os emblemas de clã e aliança nas invocações. Padrão: False.
ShowSummonCrest = False

# Exibir o efeito visual de subida de nível ao trocar de subclasse.
ShowEffectSubclasschange = False

# Exibir o efeito visual na primeira, segunda e terceira transferências de classe.
ShowEffectclass = true

